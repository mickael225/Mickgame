<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Entrenamiento de Memoria 3x3</title>
	<style>
		/* Fondo puro para pantallas AMOLED */
		body {
			background-color: #000000;
			color: #ffffff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			text-align: center;
		}

		h1 {
			color: #3399FF; /* Un azul muy agradable y brillante */
			margin-bottom: 5px;
		}

		#info {
			font-size: 1.2rem;
			margin-bottom: 20px;
			color: #cccccc;
		}

		/* Cuadrícula 3x3 */
		.grid {
			display: grid;
			grid-template-columns: repeat(3, 100px);
			grid-template-rows: repeat(3, 100px);
			gap: 15px;
			margin-bottom: 30px;
		}

		/* Estilo base de los cuadros */
		.pad {
			border-radius: 15px;
			cursor: pointer;
			opacity: 0.4;
			transition: all 0.2s ease;
			box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
		}

		/* Colores distintos para cada cuadro */
		#pad-0 { background-color: #FF3B30; } /* Rojo */
		#pad-1 { background-color: #4CD964; } /* Verde */
		#pad-2 { background-color: #007AFF; } /* Azul */
		#pad-3 { background-color: #FFCC00; } /* Amarillo */
		#pad-4 { background-color: #AF52DE; } /* Morado */
		#pad-5 { background-color: #5AC8FA; } /* Celeste */
		#pad-6 { background-color: #FF9500; } /* Naranja */
		#pad-7 { background-color: #FF2D55; } /* Rosa */
		#pad-8 { background-color: #E5E5EA; } /* Blanco */

		/* Efecto de iluminación al activarse */
		.pad.active {
			opacity: 1;
			transform: scale(1.05);
			box-shadow: 0 0 25px currentColor;
		}

		/* Botón de inicio */
		button {
			background-color: #3399FF;
			color: #ffffff;
			border: none;
			padding: 12px 30px;
			font-size: 1.2rem;
			border-radius: 25px;
			cursor: pointer;
			transition: background-color 0.3s;
			font-weight: bold;
		}

		button:hover {
			background-color: #1a75ff;
		}

		button:disabled {
			background-color: #555555;
			cursor: not-allowed;
			color: #888888;
		}
	</style>
</head>
<body>

	<h1>Entrena tu Mente</h1>
	<p id="info">Presiona "Iniciar" para comenzar</p>

	<div class="grid">
		<div class="pad" id="pad-0" onclick="handlePadClick(0)"></div>
		<div class="pad" id="pad-1" onclick="handlePadClick(1)"></div>
		<div class="pad" id="pad-2" onclick="handlePadClick(2)"></div>
		<div class="pad" id="pad-3" onclick="handlePadClick(3)"></div>
		<div class="pad" id="pad-4" onclick="handlePadClick(4)"></div>
		<div class="pad" id="pad-5" onclick="handlePadClick(5)"></div>
		<div class="pad" id="pad-6" onclick="handlePadClick(6)"></div>
		<div class="pad" id="pad-7" onclick="handlePadClick(7)"></div>
		<div class="pad" id="pad-8" onclick="handlePadClick(8)"></div>
	</div>

	<button id="start-btn" onclick="startGame()">Iniciar</button>

	<script>
		let sequence = [];
		let playerSequence = [];
		let level = 0;
		let isPlayerTurn = false;

		const infoDisplay = document.getElementById('info');
		const startBtn = document.getElementById('start-btn');
		const pads = document.querySelectorAll('.pad');

		function startGame() {
			sequence = [];
			playerSequence = [];
			level = 0;
			startBtn.disabled = true;
			nextRound();
		}

		function nextRound() {
			level++;
			playerSequence = [];
			isPlayerTurn = false;
			infoDisplay.innerText = `Ronda ${level} - ¡Presta atención!`;
			
			// Añade un nuevo patrón aleatorio a la secuencia (aumenta x1)
			const randomPad = Math.floor(Math.random() * 9);
			sequence.push(randomPad);

			playSequence();
		}

		function playSequence() {
			let delay = 0;
			const delayBetweenPads = 800; // Velocidad de la demostración

			sequence.forEach((padIndex, index) => {
				setTimeout(() => {
					activatePad(padIndex);
				}, delay);
				delay += delayBetweenPads;
			});

			// Habilitar el turno del jugador cuando termine de mostrarse
			setTimeout(() => {
				isPlayerTurn = true;
				infoDisplay.innerText = `Ronda ${level} - Tu turno`;
			}, delay);
		}

		function activatePad(index) {
			const pad = document.getElementById(`pad-${index}`);
			pad.classList.add('active');
			
			// Sonido corto opcional (beep) para mejor retroalimentación
			playBeep(200 + (index * 50)); 

			setTimeout(() => {
				pad.classList.remove('active');
			}, 400); // Tiempo que permanece iluminado
		}

		function handlePadClick(index) {
			if (!isPlayerTurn) return;

			activatePad(index);
			playerSequence.push(index);

			checkSequence(playerSequence.length - 1);
		}

		function checkSequence(currentStep) {
			// Si el jugador se equivoca
			if (playerSequence[currentStep] !== sequence[currentStep]) {
				gameOver();
				return;
			}

			// Si el jugador completó la secuencia de esta ronda correctamente
			if (playerSequence.length === sequence.length) {
				isPlayerTurn = false;
				infoDisplay.innerText = "¡Excelente!";
				setTimeout(nextRound, 1000);
			}
		}

		function gameOver() {
			infoDisplay.innerText = `¡Juego Terminado! Llegaste a la Ronda ${level}.`;
			startBtn.disabled = false;
			startBtn.innerText = "Jugar de nuevo";
			isPlayerTurn = false;

			// Efecto visual de error
			pads.forEach(pad => pad.style.backgroundColor = '#FF3B30');
			setTimeout(() => {
				// Restaurar colores
				document.getElementById('pad-0').style.backgroundColor = '';
				document.getElementById('pad-1').style.backgroundColor = '';
				document.getElementById('pad-2').style.backgroundColor = '';
				document.getElementById('pad-3').style.backgroundColor = '';
				document.getElementById('pad-4').style.backgroundColor = '';
				document.getElementById('pad-5').style.backgroundColor = '';
				document.getElementById('pad-6').style.backgroundColor = '';
				document.getElementById('pad-7').style.backgroundColor = '';
				document.getElementById('pad-8').style.backgroundColor = '';
			}, 500);
		}

		// Sintetizador básico para generar un tono en cada pulsación
		const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
		function playBeep(frequency) {
			if(audioCtx.state === 'suspended') audioCtx.resume();
			const oscillator = audioCtx.createOscillator();
			const gainNode = audioCtx.createGain();
			oscillator.type = 'sine';
			oscillator.frequency.value = frequency;
			oscillator.connect(gainNode);
			gainNode.connect(audioCtx.destination);
			oscillator.start();
			gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
			oscillator.stop(audioCtx.currentTime + 0.3);
		}
	</script>
</body>
</html>
